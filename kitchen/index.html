<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>厨房｜ヤンニョムチキン研究所 都城LAB</title>
<link rel="icon" href="../images/logo.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1E1715;font-family:'Hiragino Sans','Zen Kaku Gothic New',sans-serif;color:#F4EADB}
  .wrap{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#7E0B0C;flex:none;overflow-x:auto}
  header img{width:34px;height:34px;border-radius:50%;background:#F4EADB;flex:none}
  .tabs{display:flex;gap:8px;flex:1}
  .tabs button{flex:none;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:10px 18px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
  .tabs button.on{background:#FFE45C;border-color:#FFE45C;color:#7E0B0C}
  .reload{flex:none;border:none;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .panes{position:relative;flex:1;background:#fff}
  .panes iframe{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden}
  .panes iframe.on{visibility:visible}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../images/logo.png" alt="ロゴ">
    <div class="tabs" role="tablist">
      <button type="button" data-t="bento" class="on">お弁当</button>
      <button type="button" data-t="takeout">テイクアウト</button>
      <button type="button" data-t="delivery">配達リスト</button>
      <button type="button" data-t="calendar">お弁当のお休み</button>
    </div>
    <button type="button" class="reload" id="reload">更新</button>
  </header>
  <div class="panes">
    <iframe data-p="bento" class="on" title="お弁当の厨房" allow="autoplay; clipboard-write" src="https://yangnyeom-bento-miyakonojo.vercel.app/kitchen.html"></iframe>
    <iframe data-p="takeout" title="テイクアウトの設定" allow="clipboard-write" src="../order/#kitchen"></iframe>
    <iframe data-p="delivery" title="配達リスト" data-src="https://yangnyeom-bento-miyakonojo.vercel.app/delivery.html"></iframe>
    <iframe data-p="calendar" title="お弁当のお休み" data-src="https://yangnyeom-bento-miyakonojo.vercel.app/calendar.html"></iframe>
  </div>
</div>
<script>
const tabs=[...document.querySelectorAll('.tabs button')];
const panes=[...document.querySelectorAll('.panes iframe')];
function show(t){
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  panes.forEach(f=>{const on=f.dataset.p===t;f.classList.toggle('on',on);if(on&&!f.src&&f.dataset.src)f.src=f.dataset.src;});
  try{localStorage.setItem('kitchen-tab',t)}catch(e){}
}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));
document.getElementById('reload').onclick=()=>{const f=panes.find(x=>x.classList.contains('on'));if(f){const s=f.src;f.src='about:blank';setTimeout(()=>{f.src=s},50);}};
try{const t=localStorage.getItem('kitchen-tab');if(t&&tabs.some(b=>b.dataset.t===t))show(t)}catch(e){}
</script>
</body>
</html>
